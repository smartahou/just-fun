name: Just Fun v7.104 paper visual source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q pillow
      - name: Reconstruct contact sheet of exact git originals
        run: python scripts/audit-paper-corners-v7104.py
