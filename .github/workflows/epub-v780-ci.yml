name: EPUB paper slips regression
on:
  push:
    branches: [main]
    paths:
      - "src/server/46-reading-and-notes.js"
      - "src/client/scripts/98f-epub-paper-tabs.js"
      - "src/client/scripts/99-reading.js"
      - "src/client/styles/41-reading.css"
      - "build.manifest.json"
      - "package.json"
      - "package-lock.json"
      - "tests/epub-paper-slips-*.js"
      - ".github/workflows/epub-v780-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epub-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: EPUB parser and paper-slip UI isolated fixtures
        run: npm run test:epub-paper
      - name: Reading print regressions
        run: npm run test:reading-print
      - name: Build full offline app
        run: node scripts/build.js
      - name: Parse generated script
        run: node --check dist/douyin.js
      - name: Build report
        run: node -e "const r=require('./dist/build-report.json'); if(!r.sourceSha256)throw Error('missing source SHA');console.log(r.sourceSha256)"
