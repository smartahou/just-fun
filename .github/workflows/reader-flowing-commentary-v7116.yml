name: Just Fun v7.116 flowing editorial annotations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flowing-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Source-order, semantic prose notes, exact folios and previous regressions
        run: |
          node tests/reader-flowing-commentary-v7116.js
          node tests/reader-single-commentary-v7114.js
          node tests/reader-commentary-grid-v7113.js
          node tests/reader-natural-commentary-v7115.js
          node tests/reader-editorial-layout-v7112.js
          node tests/reader-exact-folios-v7111.js
          node tests/reading-progress-annotations-v7107.js
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify typography, EPUB captions and safe pagination
        run: |
          node tests/book-font-v7110.js
          node tests/paged-forward-boundary-v7103.js
          node tests/epub-caption-v7106.js
          npm run test:reading-print
          npm run test:epub-paper
      - name: Build standalone application retaining all original paper and fonts
        run: |
          node scripts/build.js > /tmp/jf-v7116-build.log
          node --check dist/douyin.js
          node - <<'NODE'
          const r=require('./dist/build-report.json');
          if(r.bookFontSourceVersion!=='1.000R'||r.embeddedBookFonts?.length!==2)
            throw Error('Approved Source Han Serif fonts changed');
          if(r.paperTextures!==16||r.paperRuntimeAssetSha256?.length!==16)
            throw Error('Original aged-paper images changed');
          console.log('PASS book font and original 16 paper images preserved');
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and EPUB integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow playwright
          python -m playwright install chromium --with-deps
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Chrome - short/long references, natural spaces, page split, character equality
        run: python tests/reader-flowing-commentary-visual-v7116.py
      - name: Chrome - editorial title and saved reading anchors
        run: python tests/reader-editorial-layout-visual-v7112.py
      - name: Chrome - exact folios under new paragraph geometry
        run: python tests/reader-exact-folios-visual-v7111.py
      - name: Chrome - 200 consecutive page turns preserve source text
        run: python tests/paged-no-skip-v737.py
