name: Just Fun v7.107 book progress and poetry annotations
on:
  push:
    branches: [main]
    paths:
      - "tests/reader-interactions-v766.js"
      - "src/client/scripts/99-reading.js"
      - "src/client/styles/41-reading.css"
      - "tests/reading-progress-annotations-v7107.js"
      - "tests/reading-progress-visual-v7107.py"
      - "tests/imprint-typesetting-v767.js"
      - "package.json"
      - ".github/workflows/reading-progress-v7107.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify progress calculation, scoped annotations and older reader paths
        run: |
          node tests/reading-progress-annotations-v7107.js
          node tests/imprint-typesetting-v767.js
          node tests/epub-caption-v7106.js
          node tests/paged-forward-boundary-v7103.js
          node tests/print-ink-v7105.js
          npm run test:reading-print
          npm run test:epub-paper
          node tests/reader-interactions-v766.js
      - name: Verify offline build, syntax and untouched original paper
        run: |
          node scripts/build.js > /tmp/jf-v7107-build.log
          node --check dist/douyin.js
          node -e "const b=require('./dist/build-report.json'); if(b.paperTextures!==16||b.paperRuntimeAssetSha256.length!==16)throw Error('Original paper damaged'); console.log('PASS 16 approved photographic pages');"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Chromium and fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow playwright
          python -m playwright install chromium --with-deps
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Actual EPUB screenshot and percentage/table DOM verification
        run: python tests/reading-progress-visual-v7107.py
      - name: Continuous paged reading without lost text
        run: python tests/paged-no-skip-v737.py
