name: Just Fun v7.106 photo caption and numeral font audit
on:
  push:
    branches: [main]
    paths:
      - "src/client/scripts/99-reading.js"
      - "src/client/styles/41-reading.css"
      - "tests/epub-caption-v7106.js"
      - "tests/print-ink-v7105.js"
      - "tests/imprint-typesetting-v767.js"
      - "tests/epub-caption-visual-v7106.py"
      - ".github/workflows/epub-caption-v7106.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caption-and-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Caption isolation and existing reader regressions
        run: |
          node tests/epub-caption-v7106.js
          node tests/imprint-typesetting-v767.js
          npm run test:reading-print
          npm run test:epub-paper
          node tests/reader-interactions-v766.js
          node tests/paged-forward-boundary-v7103.js
          node tests/print-ink-v7105.js
          node tests/printed-typography-v769.js
      - name: Validate offline build and 8 original paper photo pairs
        run: |
          node scripts/build.js > /tmp/jf-v7106-build.log
          node --check dist/douyin.js
          node -e "const r=require('./dist/build-report.json');if(r.paperTextures!==16||r.paperRuntimeAssetSha256.length!==16)throw Error('original WebP textures missing'); console.log('PASS 16 original paper assets, offline product compiled');"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow playwright
          python -m playwright install chromium --with-deps
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Verify actual picture-caption alignment and numeric font fallback
        run: python tests/epub-caption-visual-v7106.py
      - name: Verify no EPUB page skips
        run: python tests/paged-no-skip-v737.py
