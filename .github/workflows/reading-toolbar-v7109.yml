name: Just Fun v7.109 lean reading toolbar
on:
  push:
    branches: [main]
    paths:
      - "src/client/index.html"
      - "src/client/scripts/99-reading.js"
      - "src/client/styles/41-reading.css"
      - "tests/reading-toolbar-v7109.js"
      - "tests/reading-toolbar-visual-v7109.py"
      - "tests/reading-preferences-v7108.js"
      - "tests/reader-interactions-v766.js"
      - "package.json"
      - ".github/workflows/reading-toolbar-v7109.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epub-toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit regression for removed scramble and inactive book theme
        run: |
          node tests/reading-toolbar-v7109.js
          node tests/reading-preferences-v7108.js
          node tests/reader-interactions-v766.js
          node tests/reading-progress-annotations-v7107.js
          node tests/epub-caption-v7106.js
          node tests/paged-forward-boundary-v7103.js
          npm run test:reading-print
          npm run test:epub-paper
      - name: Compile actual Just Fun and verify approved paper remains
        run: |
          node scripts/build.js > /tmp/jf-v7109-build.log
          node --check dist/douyin.js
          node -e "const b=require('./dist/build-report.json');if(b.paperTextures!==16||b.paperRuntimeAssetSha256.length!==16)throw Error('Original paper texture missing'); console.log('PASS all original paper textures embedded');"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and browser fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow playwright
          python -m playwright install chromium --with-deps
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Real EPUB mask removal and night theme state
        run: python tests/reading-toolbar-visual-v7109.py
      - name: Actual continuous EPUB paging unchanged
        run: python tests/paged-no-skip-v737.py
