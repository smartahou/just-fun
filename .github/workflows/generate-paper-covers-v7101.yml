name: Generate v7.101 photographic cover sources
on:
  push:
    branches: [feat/v7101-photographic-bookcases]
permissions:
  contents: write
jobs:
  produce:
    if: "!contains(github.event.head_commit.message, '[cover-assets]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make twelve paired photographic hollow bookcases
        run: |
          python -m pip install --quiet pillow==12.0.0 numpy==2.3.5
          python scripts/generate-paper-covers-v7101.py
      - name: Version binary images and offline bundle
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/paper-covers/embedded-v7101.json assets/paper-covers/v7101/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(reading): [cover-assets] twelve genuine photographic bookcases"
          git push origin HEAD:feat/v7101-photographic-bookcases
