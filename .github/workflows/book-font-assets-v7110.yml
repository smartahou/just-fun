name: Just Fun v7.110 pinned book fonts (one-time materialization)
on:
  push:
    branches: [main]
    paths:
      - "scripts/build-book-fonts-v7110.py"
      - ".github/workflows/book-font-assets-v7110.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: justfun-v7110-font-asset-publish
  cancel-in-progress: false
jobs:
  materialize-verified-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible WOFF2 generator
        run: python -m pip install -q 'fonttools[woff]==4.63.0'
      - name: Download exact historical font binaries and verify uploaded OTF digests
        run: python scripts/build-book-fonts-v7110.py
      - name: Validate 400 and 600 fonts plus included OFL license
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from fontTools.ttLib import TTFont
          folder=pathlib.Path('assets/fonts/book-serif')
          manifest=json.loads((folder/'manifest.json').read_text('utf8'))
          assert manifest['version']=='7.110.0'
          assert manifest['originals_match_user_upload']
          assert len(manifest['files'])==2
          assert {e['weight'] for e in manifest['files']}=={400,600}
          assert (folder/'OFL-1.1.txt').read_text().find('SIL OPEN FONT LICENSE')>=0
          for e in manifest['files']:
            raw=(folder/e['filename']).read_bytes()
            assert raw[:4]==b'wOF2'
            assert hashlib.sha256(raw).hexdigest()==e['sha256']
            assert len(raw)==e['bytes']
            font=TTFont(folder/e['filename'])
            cm=font.getBestCmap()
            assert len(cm)>8000
            for c in '宋楷体唐诗道光皇帝史书《》。，1842':
              assert ord(c) in cm
          print('PASS v7.110 official font 1.000R, SHA checked, WOFF2/400/600 + OFL')
          PY
      - name: Commit only the verified font assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/book-serif/
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "v7.110 font assets already current"
            exit 0
          fi
          git commit -m "assets(fonts): verified Source Han Serif CN 1.000R offline 400/600 WOFF2 and OFL"
          git push origin HEAD:main
