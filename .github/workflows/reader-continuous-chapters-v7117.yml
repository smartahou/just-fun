name: Just Fun main CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: just-fun-main-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  continuous-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Continuous chapter semantics and reading regressions
        run: |
          node --check src/client/scripts/99-reading.js
          node --check src/client/scripts/98d-page-engine.js
          node tests/reader-continuous-chapters-v7117.js
          node tests/reader-semantic-pagination-v7118.js
          node tests/reader-incremental-pagination-v7119.js
          node tests/reader-backtracking-v7120.js
          node tests/reader-rapid-turn-v7121.js
          node tests/reader-flowing-commentary-v7116.js
          node tests/reader-single-commentary-v7114.js
          node tests/reader-commentary-grid-v7113.js
          node tests/reader-natural-commentary-v7115.js
          node tests/reader-editorial-layout-v7112.js
          node tests/reader-exact-folios-v7111.js
          node tests/reading-progress-annotations-v7107.js
          node tests/paged-forward-boundary-v7103.js
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify original EPUB print and build
        run: |
          npm run test:reading-print
          npm run test:epub-paper
          npm run test:reading-controls
          npm run test:reading-progress
          npm run test:reader-toolbar
          npm run test:book-font
          npm run test:caption
          npm run test:print-ink
          node scripts/build.js
          node --check dist/douyin.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium for real reader acceptance
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install chromium --with-deps
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Real Chromium - no blank leaves, no skipped poetry, bounded window
        run: python tests/reader-page-performance-v7119.py
      - name: Real Chromium - middle-book reverse and full roundtrip
        run: python tests/reader-backtracking-v7120.py
      - name: Real Chromium - 110-chapter rapid reverse stress and same-frame burst
        run: python tests/reader-rapid-turn-v7121.py
      - name: Real Chromium - previous commentary and source character integrity
        run: python tests/reader-flowing-commentary-visual-v7116.py

