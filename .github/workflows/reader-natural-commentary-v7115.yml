name: Just Fun v7.115 natural commentary spacing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  printed-gutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Source-width aware citation gutter and old pagination contracts
        run: |
          node tests/reader-natural-commentary-v7115.js
          node tests/reader-single-commentary-v7114.js
          node tests/reader-commentary-grid-v7113.js
          node tests/reader-editorial-layout-v7112.js
          node tests/reader-exact-folios-v7111.js
          node tests/reading-progress-annotations-v7107.js
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Original typography, captions and page-turning unit regressions
        run: |
          node tests/book-font-v7110.js
          node tests/paged-forward-boundary-v7103.js
          node tests/epub-caption-v7106.js
          npm run test:reading-print
          npm run test:epub-paper
      - name: Build standalone Just Fun and check original fonts and paper assets
        run: |
          node scripts/build.js > /tmp/jf-v7115-build.log
          node --check dist/douyin.js
          node - <<'NODE'
          const r=require('./dist/build-report.json');
          if(r.bookFontSourceVersion!=='1.000R'||r.embeddedBookFonts?.length!==2)
            throw Error('Embedded book font assets changed');
          if(r.paperTextures!==16||r.paperRuntimeAssetSha256?.length!==16)
            throw Error('Old-paper artwork changed');
          console.log('PASS fonts and sixteen book textures intact');
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium for real EPUB geometry tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow playwright
          python -m playwright install chromium --with-deps
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Chromium compare short single-row source and longer multirow source
        run: python tests/reader-single-commentary-visual-v7114.py
      - name: Chromium check identical columns across long multirow pages
        run: python tests/reader-commentary-grid-visual-v7113.py
      - name: Chromium check no orphan headings and restored reading anchor
        run: python tests/reader-editorial-layout-visual-v7112.py
      - name: Chromium verify exact physical folios
        run: python tests/reader-exact-folios-visual-v7111.py
      - name: Chromium verify 200 consecutive page turns
        run: python tests/paged-no-skip-v737.py
